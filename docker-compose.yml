services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    environment:
      # App bind + port
      BIND_ADDRESS: "0.0.0.0"
      APP_PORT: "8080"
      # Prerequisite markdown inside the image
      PREREQ_PATH: "/app/prerequisite-knowledge"
      # Deploro Auth-as-a-Service
      DEPLORO_AUTH_BASE_URL: "${DEPLORO_AUTH_BASE_URL:-}"
      DEPLORO_AUTH_SLUG: "${DEPLORO_AUTH_SLUG:-}"
      APP_PUBLIC_BASE_URL: "${APP_PUBLIC_BASE_URL:-https://gamified-java-prep.deploro.app}"
      APP_ENCRYPTION_KEY: "${APP_ENCRYPTION_KEY:-}"
      # AI backend (set via deploro vps set-env)
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-}"
      OLLAMA_PROTOCOL: "${OLLAMA_PROTOCOL:-ollama}"
      # Invitation email delivery (Cloudflare Email Sending REST API)
      CLOUDFLARE_ACCOUNT_ID: "${CLOUDFLARE_ACCOUNT_ID:-}"
      CLOUDFLARE_EMAIL_API_TOKEN: "${CLOUDFLARE_EMAIL_API_TOKEN:-}"
      INVITE_FROM_EMAIL: "${INVITE_FROM_EMAIL:-}"
      INVITE_FROM_NAME: "${INVITE_FROM_NAME:-JAVA_CORE}"
      # Data store â€” Deploro Studio REST API (deploro migrate schema + tokens)
      DEPLORO_API_URL: "${DEPLORO_API_URL:-}"
      DEPLORO_API_TOKEN: "${DEPLORO_API_TOKEN:-}"
      JAVA_OPTS: "${JAVA_OPTS:--Xmx1g}"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
