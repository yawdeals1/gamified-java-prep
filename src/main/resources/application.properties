spring.application.name=gamified-java-prep
server.port=${APP_PORT:8080}

# Bind address: 127.0.0.1 for local dev; the docker-compose stack sets
# BIND_ADDRESS=0.0.0.0 for the deployed container.
server.address=${BIND_ADDRESS:127.0.0.1}

# Trust X-Forwarded-* headers from the deployment reverse proxy (HTTPS detection)
server.forward-headers-strategy=framework

# Cap request bodies (defense against oversized sourceCode / message payloads)
server.tomcat.max-swallow-size=1MB
server.tomcat.max-http-form-post-size=1MB

# Never include exception details in error responses
server.error.include-message=never
server.error.include-exception=false
server.error.include-stacktrace=never

# Deploro Studio API (the app's data store — per-project auto-generated REST API)
# DEPLORO_API_URL  : https://<deploro-worker>/api/projects/<project-id>/studio
# DEPLORO_API_TOKEN: project-scoped personal access token (deploro token create)
deploro.api.base-url=${DEPLORO_API_URL:}
deploro.api.token=${DEPLORO_API_TOKEN:}

# Thymeleaf: cache templates in production (override via THYMELEAF_CACHE=false)
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# Static resources: cache CSS/JS/img at the browser and Cloudflare edge (7 days)
spring.web.resources.cache.period=7d
spring.web.resources.cache.cachecontrol.must-revalidate=false

# Ollama-compatible model backend. OLLAMA_BASE_URL is a hosted Ollama-compatible
# endpoint in production (set via deploro vps set-env); OLLAMA_API_KEY is sent
# as a Bearer token when provided. OLLAMA_PROTOCOL: ollama (native /api/generate)
# or openai (/v1/chat/completions).
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:gemma4:31b-cloud}
ollama.api-key=${OLLAMA_API_KEY:}
ollama.protocol=${OLLAMA_PROTOCOL:ollama}

# Deploro Auth-as-a-Service (end-user sign up / sign in)
# DEPLORO_AUTH_BASE_URL = Deploro worker base URL (https://...)
# DEPLORO_AUTH_SLUG     = this project's auth slug (from deploro projects)
deploro.auth.base-url=${DEPLORO_AUTH_BASE_URL:}
deploro.auth.slug=${DEPLORO_AUTH_SLUG:}

# Prerequisite markdown content path (repo-relative in dev, /app/... in the image)
prerequisite.path=${PREREQ_PATH:prerequisite-knowledge}
