<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — Gamified Java Prep</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-mono antialiased min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <div class="text-emerald-400 text-3xl mb-2">&#9881;</div>
            <h1 class="text-xl font-bold tracking-tight">Gamified <span class="text-emerald-400">Java</span> Prep</h1>
            <p class="text-gray-500 text-xs mt-2">Sign in to continue your learning loop</p>
        </div>

        <div th:if="${error}" class="mb-4 bg-red-950/60 border border-red-800 text-red-300 text-xs rounded-lg px-4 py-3" th:text="${error}">Error</div>

        <form method="post" action="/auth/login" class="bg-gray-900 border border-gray-800 rounded-xl p-6 space-y-4">
            <div>
                <label class="block text-xs text-gray-400 mb-1.5" for="email">EMAIL</label>
                <input id="email" name="email" type="email" required autofocus
                       class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-emerald-400 transition-colors"
                       placeholder="you@example.com">
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1.5" for="password">PASSWORD</label>
                <input id="password" name="password" type="password" required
                       class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-emerald-400 transition-colors"
                       placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;">
            </div>
            <button type="submit"
                    class="w-full bg-emerald-500 hover:bg-emerald-400 text-black font-bold text-sm rounded-lg py-2.5 transition-colors">
                Sign In
            </button>
        </form>

        <p class="text-center text-xs text-gray-500 mt-6">
            New here?
            <a href="/auth/signup" class="text-emerald-400 hover:text-emerald-300">Create an account</a>
        </p>
    </div>
</body>
</html>
