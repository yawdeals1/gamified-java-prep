<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up — Gamified Java Prep</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-mono antialiased min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <div class="text-emerald-400 text-3xl mb-2">&#9881;</div>
            <h1 class="text-xl font-bold tracking-tight">Create your <span class="text-emerald-400">account</span></h1>
            <p class="text-gray-500 text-xs mt-2">Start earning XP on the path to Spring Boot</p>
        </div>

        <div th:if="${error}" class="mb-4 bg-red-950/60 border border-red-800 text-red-300 text-xs rounded-lg px-4 py-3" th:text="${error}">Error</div>

        <form method="post" action="/auth/signup"
              x-data="{ pw: '', pw2: '', match: true }"
              x-on:submit="match = (pw === pw2); if (!match) { $event.preventDefault(); }"
              class="bg-gray-900 border border-gray-800 rounded-xl p-6 space-y-4">
            <div>
                <label class="block text-xs text-gray-400 mb-1.5" for="name">NAME <span class="text-gray-600">(optional)</span></label>
                <input id="name" name="name" type="text" autocomplete="name"
                       class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-emerald-400 transition-colors"
                       placeholder="Ada Lovelace">
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1.5" for="email">EMAIL</label>
                <input id="email" name="email" type="email" required autofocus
                       class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-emerald-400 transition-colors"
                       placeholder="you@example.com">
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1.5" for="password">PASSWORD <span class="text-gray-600">(8+ chars)</span></label>
                <input id="password" name="password" type="password" required minlength="8" x-model="pw"
                       class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-emerald-400 transition-colors">
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1.5" for="password2">CONFIRM PASSWORD</label>
                <input id="password2" name="password2" type="password" required minlength="8" x-model="pw2"
                       class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2.5 text-sm transition-colors"
                       :class="pw && pw2 && pw !== pw2 ? 'border-red-700 focus:border-red-500' : 'border-gray-800 focus:border-emerald-400'">
                <p x-show="pw && pw2 && pw !== pw2" class="text-red-400 text-xs mt-1.5">Passwords do not match.</p>
            </div>
            <button type="submit"
                    class="w-full bg-emerald-500 hover:bg-emerald-400 text-black font-bold text-sm rounded-lg py-2.5 transition-colors">
                Create Account
            </button>
        </form>

        <p class="text-center text-xs text-gray-500 mt-6">
            Already have an account?
            <a href="/auth/login" class="text-emerald-400 hover:text-emerald-300">Sign in</a>
        </p>
    </div>
</body>
</html>
