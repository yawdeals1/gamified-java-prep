<!DOCTYPE html>
<html lang="en" class="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="'JAVA_CORE | Quiz Results · ' + ${module.title}">JAVA_CORE | Results</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: { extend: {
                colors: {
                    "cockpit-base": "#0B0F0E", "panel-slate": "#12181A", "primary": "#4edea3",
                    "on-primary": "#003824", "primary-fixed": "#6ffbbe", "primary-fixed-dim": "#4edea3",
                    "ghost-text": "#8A9895", "on-surface": "#dde4dd", "primary-text": "#EAF2EF",
                    "surface-container": "#1a211d", "surface-container-high": "#242c27",
                    "hairline": "rgba(148,163,161,0.14)", "emerald-wash": "rgba(16,185,129,0.12)",
                    "secondary": "#f5be3c", "fault-red": "#E5533C", "error": "#ffb4ab",
                    "outline-variant": "#3c4a42", "on-surface-variant": "#bbcabf"
                },
                borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", "2xl": "1rem", full: "9999px" },
                fontFamily: {
                    "body-md": ["Geist", "sans-serif"], "label-sm": ["JetBrains Mono", "monospace"],
                    "headline-lg": ["Geist", "sans-serif"], "headline-md": ["Geist", "sans-serif"],
                    "stat-lg": ["JetBrains Mono", "monospace"], "code-md": ["JetBrains Mono", "monospace"]
                }
            }}
        };
    </script>
    <style>
        body { background: #0B0F0E; color: #EAF2EF; -webkit-font-smoothing: antialiased; }
        @keyframes ring-fill { from { stroke-dashoffset: 283; } to { stroke-dashoffset: var(--target); } }
        .ring-animate { animation: ring-fill 1.2s cubic-bezier(.16,1,.3,1) forwards; }
    </style>
</head>
<body class="font-body-md min-h-screen">

<!-- Header -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-6 h-14 bg-cockpit-base border-b border-hairline">
    <a href="/" class="font-stat-lg text-xl text-primary-fixed tracking-tighter">JAVA_CORE</a>
    <div class="px-3 py-1 bg-primary/10 border border-primary/20 rounded-full">
        <span class="font-label-sm text-xs text-primary" th:text="${state.totalXp} + ' XP'">0 XP</span>
    </div>
</header>

<main class="pt-20 pb-24 px-4 flex flex-col items-center">
    <div class="w-full max-w-2xl">

        <!-- Score ring card -->
        <div class="bg-panel-slate rounded-2xl border border-hairline p-8 mb-6 text-center relative overflow-hidden">
            <div class="absolute -top-16 -right-16 w-48 h-48 bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>

            <div class="relative w-36 h-36 mx-auto mb-6">
                <svg class="w-full h-full -rotate-90" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="45" fill="transparent" stroke="currentColor"
                            stroke-width="5" class="text-primary opacity-10"/>
                    <circle cx="50" cy="50" r="45" fill="transparent" stroke="currentColor"
                            stroke-width="5" stroke-linecap="round" stroke-dasharray="283"
                            class="ring-animate"
                            th:classappend="${result.percentage >= 80} ? 'text-primary' : 'text-fault-red'"
                            th:attr="style='--target:' + ${283 - (result.percentage * 283 / 100)}"
                            stroke-dashoffset="283"/>
                </svg>
                <div class="absolute inset-0 flex flex-col items-center justify-center">
                    <span class="font-stat-lg text-3xl font-bold"
                          th:classappend="${result.percentage >= 80} ? 'text-primary' : 'text-fault-red'"
                          th:text="${result.percentage} + '%'">0%</span>
                    <span class="font-label-sm text-[10px] text-ghost-text uppercase tracking-wider">Score</span>
                </div>
            </div>

            <h1 class="font-headline-lg text-2xl text-primary-text mb-2"
                th:text="${result.percentage >= 80} ? 'Nice work!' : 'Keep practicing.'">Result</h1>
            <p class="font-body-md text-ghost-text">
                <span class="text-primary" th:text="${result.correct}">0</span>
                of <span th:text="${result.total}">0</span> correct
            </p>

            <div class="inline-flex items-center gap-2 mt-4 px-4 py-1.5 rounded-full border font-label-sm text-xs uppercase tracking-wider"
                 th:classappend="${result.percentage >= 80} ? 'border-primary/40 bg-emerald-wash text-primary' : 'border-fault-red/30 bg-fault-red/5 text-fault-red'">
                <span class="material-symbols-outlined text-sm" style="font-variation-settings:'FILL' 1;"
                      th:text="${result.percentage >= 80} ? 'verified' : 'replay'">verified</span>
                <span th:text="${result.percentage >= 80} ? 'Passed' : 'Needs 80% to pass'">Passed</span>
            </div>
        </div>

        <!-- Per-question breakdown -->
        <h2 class="font-label-sm text-xs text-ghost-text uppercase tracking-widest mb-3">Question Breakdown</h2>
        <div class="space-y-3 mb-8">
            <div th:each="attempt, iter : ${result.attempts}"
                 class="bg-panel-slate rounded-xl border p-4"
                 th:classappend="${attempt.correct} ? 'border-primary/20' : 'border-fault-red/20'">
                <div class="flex items-start gap-3">
                    <span class="material-symbols-outlined text-base mt-0.5 shrink-0"
                          th:classappend="${attempt.correct} ? 'text-primary' : 'text-fault-red'"
                          th:text="${attempt.correct} ? 'check_circle' : 'cancel'"
                          style="font-variation-settings:'FILL' 1;">check_circle</span>
                    <div class="flex-1 min-w-0">
                        <p class="font-body-md text-sm text-primary-text mb-1"
                           th:text="${attempt.question.questionText}">Question text</p>
                        <p th:if="${!attempt.correct and attempt.question.correctIndex != null}"
                           class="font-label-sm text-xs text-ghost-text mb-1.5">
                            Correct answer:
                            <span class="text-primary"
                                  th:text="${attempt.question.optionList[attempt.question.correctIndex]}">answer</span>
                        </p>
                        <p th:if="${attempt.question.explanation}"
                           class="font-label-sm text-xs text-on-surface-variant leading-relaxed"
                           th:text="${attempt.question.explanation}"></p>
                    </div>
                    <span class="font-label-sm text-[10px] text-ghost-text shrink-0"
                          th:text="'Q' + ${iter.count}">#</span>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="flex flex-col sm:flex-row gap-3">
            <a href="/"
               class="flex-1 px-6 py-3 bg-primary text-on-primary font-bold rounded-xl flex items-center justify-center gap-2 hover:brightness-110 active:-translate-y-px transition-all">
                <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">map</span>
                Skill Map
            </a>
            <a th:href="@{/learn/{slug}(slug=${module.slug})}"
               class="flex-1 px-6 py-3 border border-hairline text-ghost-text font-medium rounded-xl flex items-center justify-center gap-2 hover:text-on-surface hover:border-outline-variant transition-all">
                <span class="material-symbols-outlined">school</span>
                Continue Lesson
            </a>
            <a th:if="${result.percentage < 80}"
               th:href="@{/module/{slug}/quiz(slug=${module.slug})}"
               class="flex-1 px-6 py-3 border border-primary/30 text-primary font-medium rounded-xl flex items-center justify-center gap-2 hover:bg-emerald-wash transition-all">
                <span class="material-symbols-outlined">quiz</span>
                Retry Quiz
            </a>
        </div>
    </div>
</main>
</body>
</html>
