<!DOCTYPE html>
<html lang="en" class="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>JAVA_CORE | Sandbox</title>
    <link rel="stylesheet" href="/css/app.css"/>
    <link rel="stylesheet" href="/css/code-editor.css"/>
    <link rel="stylesheet" href="/css/fonts.css?v=4" media="print" onload="this.media='all'"/>
    <noscript><link href="/css/fonts.css?v=4" rel="stylesheet"/></noscript>
    <script src="/js/vendor/marked.min.js"></script>
    <script src="/webjars/dompurify/3.2.7/dist/purify.min.js"></script>
    
    <style>
        body { background: #0B0F0E; color: #EAF2EF; -webkit-font-smoothing: antialiased; }
        #editor {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            line-height: 1.6;
            background: #09100c;
            color: #EAF2EF;
            border: 1px solid rgba(148,163,161,0.14);
            border-radius: 0.75rem;
            padding: 1rem;
            resize: none;
            outline: none;
            tab-size: 4;
            caret-color: #4edea3;
            width: 100%;
            min-height: 400px;
        }
        #editor:focus { border-color: rgba(78,222,163,0.3); }
        #console-out {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            line-height: 1.6;
            background: #09100c;
            color: #bbcabf;
            border: 1px solid rgba(148,163,161,0.14);
            border-radius: 0.5rem;
            padding: 1rem;
            min-height: 120px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .md-body h1, .md-body h2, .md-body h3 {
            color: #EAF2EF;
            font-family: Geist, sans-serif;
            font-weight: 600;
            line-height: 1.3;
            margin: 1em 0 0.4em;
        }
        .md-body h1 { font-size: 1.2rem; }
        .md-body h2 { font-size: 1.05rem; }
        .md-body h3 { font-size: 0.95rem; }
        .md-body p { margin: 0.55em 0; }
        .md-body ul, .md-body ol { margin: 0.55em 0; padding-left: 1.4rem; }
        .md-body ul { list-style: disc; }
        .md-body ol { list-style: decimal; }
        .md-body li { margin: 0.25em 0; }
        .md-body strong { color: #EAF2EF; font-weight: 600; }
        .md-body code {
            background: rgba(78, 222, 163, 0.1);
            color: #4EDEA3;
            border-radius: 0.25rem;
            padding: 0.1em 0.3em;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9em;
        }
        .md-body pre {
            background: #09100c;
            border: 1px solid rgba(148, 163, 161, 0.14);
            border-radius: 0.5rem;
            margin: 0.7em 0;
            overflow-x: auto;
            padding: 0.75rem;
        }
        .md-body pre code { background: none; color: #EAF2EF; padding: 0; }
        .md-body blockquote {
            border-left: 2px solid #4EDEA3;
            color: #8A9895;
            margin: 0.7em 0;
            padding-left: 0.8rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spin { animation: spin 0.8s linear infinite; }
    </style>
</head>
<body class="font-body-md h-screen flex flex-col">

<!-- Header -->
<header class="flex-none flex justify-between items-center px-6 h-14 bg-cockpit-base border-b border-hairline">
    <div class="flex items-center gap-6">
        <a href="/" class="font-stat-lg text-xl text-primary-fixed tracking-tighter">JAVA_CORE</a>
        <nav class="hidden md:flex gap-6">
            <a href="/" class="font-label-sm text-xs uppercase tracking-wider text-ghost-text hover:text-on-surface transition-colors">Skill Map</a>
            <a href="/achievements" class="font-label-sm text-xs uppercase tracking-wider text-ghost-text hover:text-on-surface transition-colors">Achievements</a>
            <a href="/ai/chat" class="font-label-sm text-xs uppercase tracking-wider text-ghost-text hover:text-on-surface transition-colors">AI Tutor</a>
            <a href="/profile" class="font-label-sm text-xs uppercase tracking-wider text-ghost-text hover:text-on-surface transition-colors">Profile</a>
            <a href="/sandbox" class="font-label-sm text-xs uppercase tracking-wider text-primary border-b-2 border-primary pb-1">Sandbox</a>
        </nav>
    </div>
    <div class="flex items-center gap-3">
        <span class="font-label-sm text-[10px] text-ghost-text uppercase tracking-widest">Free-form editor</span>
        <div class="px-3 py-1 bg-primary/10 border border-primary/20 rounded-full">
            <span class="font-label-sm text-xs text-primary" th:text="${state.totalXp} + ' XP'">0 XP</span>
        </div>
        <div th:replace="~{fragments/session :: session}"></div>
    </div>
</header>

<main class="flex-1 overflow-hidden flex flex-col px-6 py-5 gap-4" style="max-width:1100px; margin:0 auto; width:100%;">

    <!-- Title row -->
    <div class="flex items-center justify-between flex-none">
        <div>
            <h1 class="font-headline-lg text-xl text-primary-text font-bold">Sandbox</h1>
            <p class="font-label-sm text-[10px] text-ghost-text mt-0.5">Write any Java, press Run. No lessons, no grading.</p>
        </div>
        <!-- Controls -->
        <div class="flex items-center gap-3">
            <button onclick="clearCode()"
                    class="px-4 py-2 border border-hairline rounded-xl font-label-sm text-xs text-ghost-text hover:text-on-surface hover:border-outline-variant transition-all flex items-center gap-2">
                <span class="material-symbols-outlined text-sm">delete_sweep</span>
                Clear
            </button>
            <button onclick="runCode()" id="run-btn"
                    class="px-5 py-2 bg-primary text-on-primary rounded-xl font-label-sm text-sm font-bold hover:brightness-110 active:-translate-y-px transition-all flex items-center gap-2">
                <span class="material-symbols-outlined text-base" id="run-icon" style="font-variation-settings:'FILL' 1;">play_arrow</span>
                Run
            </button>
        </div>
    </div>

    <!-- Split pane -->
    <div class="flex-1 grid grid-cols-1 lg:grid-cols-[1fr_360px] gap-4 min-h-0">

        <!-- Editor -->
        <div class="flex flex-col gap-2 min-h-0">
            <div class="flex items-center gap-2 flex-none">
                <span class="material-symbols-outlined text-primary text-sm"
                      style="font-variation-settings:'FILL' 0;">code</span>
                <span class="font-label-sm text-[10px] text-ghost-text uppercase tracking-widest">Editor | Main.java</span>
                <span id="compile-badge" class="hidden font-label-sm text-[10px] px-2 py-0.5 rounded-full uppercase tracking-wider"></span>
            </div>
            <textarea id="editor" data-code-editor data-code-editor-frame aria-label="Java source code" spellcheck="false"
                      onkeydown="handleTab(event)"
                      placeholder="// Write your Java here...
public class Main {
    public static void main(String[] args) {
        System.out.println(&quot;Hello, World!&quot;);
    }
}">public class Main {
    public static void main(String[] args) {
        System.out.println("Hello, World!");
    }
}</textarea>
        </div>

        <!-- Right panel: console + AI review -->
        <div class="flex flex-col gap-4 min-h-0">

            <!-- Console -->
            <div class="flex flex-col gap-2">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <span class="material-symbols-outlined text-primary text-sm"
                              style="font-variation-settings:'FILL' 0;">terminal</span>
                        <span class="font-label-sm text-[10px] text-ghost-text uppercase tracking-widest">Console Output</span>
                    </div>
                    <button onclick="clearConsole()"
                            class="font-label-sm text-[10px] text-ghost-text/50 hover:text-ghost-text transition-colors">clear</button>
                </div>
                <div id="console-out" class="text-ghost-text/50">Run your code to see output here.</div>
            </div>

            <!-- AI Review -->
            <div class="flex flex-col gap-2 flex-1">
                <div class="flex items-center gap-2">
                    <span class="material-symbols-outlined text-primary text-sm"
                          style="font-variation-settings:'FILL' 1;">smart_toy</span>
                    <span class="font-label-sm text-[10px] text-ghost-text uppercase tracking-widest">AI Review</span>
                </div>
                <div id="ai-out" class="md-body bg-surface-container rounded-xl border border-hairline p-4 flex-1 overflow-y-auto text-sm text-on-surface-variant leading-relaxed font-body-md"
                     style="min-height:120px; max-height: 300px;">
                    <span class="text-ghost-text/40 font-label-sm text-xs">Ask the AI to review your code after running it.</span>
                </div>
                <div class="flex gap-2">
                    <button onclick="aiReview()" data-ai-action
                            class="flex-1 px-4 py-2 bg-emerald-wash border border-primary/20 rounded-xl font-label-sm text-xs text-primary hover:bg-primary/15 transition-all flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined text-sm" style="font-variation-settings:'FILL' 1;">rate_review</span>
                        Review my code
                    </button>
                    <button onclick="aiExplain()" data-ai-action
                            class="flex-1 px-4 py-2 border border-hairline rounded-xl font-label-sm text-xs text-ghost-text hover:text-on-surface hover:border-outline-variant transition-all flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined text-sm">help_outline</span>
                        Explain
                    </button>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
    function handleTab(e) {
        if (e.key === 'Tab') {
            e.preventDefault();
            const ta = document.getElementById('editor');
            const start = ta.selectionStart;
            const end = ta.selectionEnd;
            ta.value = ta.value.substring(0, start) + '    ' + ta.value.substring(end);
            ta.selectionStart = ta.selectionEnd = start + 4;
        }
    }

    function clearCode() {
        const editor = document.getElementById('editor');
        editor.value = '';
        JavaCodeEditor.refresh(editor);
        editor.focus();
    }

    function clearConsole() {
        document.getElementById('console-out').textContent = 'Run your code to see output here.';
        document.getElementById('console-out').style.color = '';
        hideBadge();
    }

    function hideBadge() {
        document.getElementById('compile-badge').classList.add('hidden');
    }

    function setBadge(ok) {
        const b = document.getElementById('compile-badge');
        b.classList.remove('hidden');
        if (ok) {
            b.textContent = 'Compiled';
            b.className = 'font-label-sm text-[10px] px-2 py-0.5 rounded-full uppercase tracking-wider bg-emerald-wash text-primary border border-primary/20';
        } else {
            b.textContent = 'Error';
            b.className = 'font-label-sm text-[10px] px-2 py-0.5 rounded-full uppercase tracking-wider bg-fault-red/10 text-fault-red border border-fault-red/20';
        }
    }

    function setRunLoading(loading) {
        const btn = document.getElementById('run-btn');
        const icon = document.getElementById('run-icon');
        if (loading) {
            icon.textContent = 'progress_activity';
            icon.classList.add('spin');
            btn.disabled = true;
            btn.classList.add('opacity-60');
        } else {
            icon.textContent = 'play_arrow';
            icon.classList.remove('spin');
            btn.disabled = false;
            btn.classList.remove('opacity-60');
        }
    }

    async function runCode() {
        const code = document.getElementById('editor').value.trim();
        if (!code) return;
        setRunLoading(true);
        const out = document.getElementById('console-out');
        out.textContent = 'Running...';
        out.style.color = '#8A9895';
        try {
            const r = await fetch('/api/run', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sourceCode: code })
            });
            const d = await r.json();
            setBadge(d.compiled);
            if (!d.compiled) {
                out.textContent = d.stderr || 'Compilation failed.';
                out.style.color = '#E5533C';
            } else {
                const text = (d.stdout || '') + (d.stderr ? '\n[stderr]\n' + d.stderr : '');
                out.textContent = text || '(no output)';
                out.style.color = '#4edea3';
            }
        } catch (e) {
            out.textContent = 'Error connecting to server.';
            out.style.color = '#E5533C';
            hideBadge();
        }
        setRunLoading(false);
    }

    function setAiLoading(loading) {
        document.querySelectorAll('[data-ai-action]').forEach(button => {
            button.disabled = loading;
            button.classList.toggle('opacity-60', loading);
        });
    }

    function renderMarkdown(text) {
        if (!text) return '';
        if (typeof marked === 'undefined' || typeof DOMPurify === 'undefined') {
            return text.replace(/&/g, '&amp;').replace(/</g, '&lt;');
        }
        const html = marked.parse(text, { gfm: true, breaks: true });
        return DOMPurify.sanitize(html, {
            ALLOWED_TAGS: ['p', 'br', 'strong', 'em', 'code', 'pre', 'ul', 'ol', 'li',
                'h1', 'h2', 'h3', 'blockquote', 'table', 'thead', 'tbody', 'tr', 'th', 'td', 'hr'],
            ALLOWED_ATTR: []
        });
    }

    async function aiCall(prompt, context) {
        const aiOut = document.getElementById('ai-out');
        aiOut.innerHTML = '<div class="flex items-center gap-2 text-ghost-text/50"><span class="material-symbols-outlined text-sm spin">progress_activity</span><span class="font-label-sm text-xs">Thinking...</span></div>';
        setAiLoading(true);
        const code = document.getElementById('editor').value;
        const params = new URLSearchParams();
        params.append('message', prompt + (code ? '\n\nCode:\n```java\n' + code + '\n```' : ''));
        params.append('context', context);
        try {
            const r = await fetch('/ai/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params
            });
            const d = await r.json().catch(() => ({}));
            if (!r.ok) {
                throw new Error(d.response || `AI request failed (${r.status}).`);
            }
            aiOut.innerHTML = renderMarkdown(d.response || 'The AI returned an empty response. Please try again.');
        } catch (error) {
            aiOut.textContent = error.message || 'Could not reach the AI tutor. Please try again.';
        } finally {
            setAiLoading(false);
        }
    }

    function aiReview() {
        aiCall('Review this Java code. Give a brief verdict: what works, what to improve.', 'review');
    }

    function aiExplain() {
        aiCall('Explain what this Java code does, step by step, simply.', 'explain');
    }

    // Ctrl+Enter to run
    document.getElementById('editor').addEventListener('keydown', e => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); runCode(); }
    });
</script>
<script src="/js/code-editor.js"></script>
</body>
</html>
