<!DOCTYPE html>
<html lang="en" class="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>JAVA_CORE | Error</title>
    <link rel="stylesheet" href="/css/app.css"/>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <style>body { background: #0B0F0E; color: #EAF2EF; -webkit-font-smoothing: antialiased; }</style>
</head>
<body class="font-body-md min-h-screen flex flex-col">

<header class="flex justify-between items-center px-6 h-14 bg-cockpit-base border-b border-hairline">
    <a href="/" class="font-stat-lg text-xl text-primary-fixed tracking-tighter">JAVA_CORE</a>
</header>

<main class="flex-1 flex flex-col items-center justify-center px-6 text-center">
    <span class="material-symbols-outlined text-fault-red/50 text-6xl mb-6"
          style="font-variation-settings:'FILL' 0;">bug_report</span>

    <span class="font-label-sm text-[10px] text-fault-red uppercase tracking-widest mb-3"
          th:text="${status != null ? status : ''}">404</span>
    <h1 class="font-headline-lg text-3xl text-primary-text font-bold mb-3"
        th:text="${status == 404 ? 'Page Not Found' : 'Something Went Wrong'}">Error</h1>
    <p class="font-body-md text-ghost-text mb-8 max-w-sm"
       th:text="${message != null ? message : 'An unexpected error occurred.'}">error message</p>

    <a href="/"
       class="px-6 py-3 bg-primary text-on-primary font-bold rounded-xl flex items-center gap-2 hover:brightness-110 active:-translate-y-px transition-all font-label-sm text-sm">
        <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">map</span>
        Back to Skill Map
    </a>
</main>
</body>
</html>
