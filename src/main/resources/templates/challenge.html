<!DOCTYPE html>
<html lang="en" class="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="'JAVA_CORE | Challenge | ' + ${module.title}">JAVA_CORE | Challenge</title>
    <link rel="stylesheet" href="/css/app.css"/>
    <link rel="stylesheet" href="/css/code-editor.css"/>
    <link rel="stylesheet" href="/css/fonts.css?v=4" media="print" onload="this.media='all'"/>
    <noscript><link href="/css/fonts.css?v=4" rel="stylesheet"/></noscript>
    
    <style>
        body { background: #0B0F0E; color: #EAF2EF; -webkit-font-smoothing: antialiased; }
        #editor {
            font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.6;
            background: #09100c; color: #EAF2EF; border: 1px solid rgba(148,163,161,0.14);
            border-radius: 0.75rem; padding: 1rem; resize: none; outline: none; tab-size: 4;
            caret-color: #4edea3; width: 100%; min-height: 360px;
        }
        #editor:focus { border-color: rgba(78,222,163,0.3); }
    </style>
</head>
<body class="font-body-md min-h-screen">

<header class="fixed top-0 w-full z-50 flex justify-between items-center px-6 h-14 bg-cockpit-base border-b border-hairline">
    <div class="flex items-center gap-6">
        <a href="/" class="font-stat-lg text-xl text-primary-fixed tracking-tighter">JAVA_CORE</a>
        <div class="flex items-center gap-2">
            <span class="font-label-sm text-[10px] text-ghost-text uppercase tracking-widest">Challenge</span>
            <span class="font-label-sm text-[10px] text-ghost-text">/</span>
            <span class="font-label-sm text-[10px] text-primary uppercase tracking-widest"
                  th:text="${module.title}">Module</span>
        </div>
    </div>
    <div class="flex items-center gap-3">
        <a th:href="@{/learn/{slug}(slug=${module.slug})}"
           class="font-label-sm text-xs text-ghost-text hover:text-on-surface transition-colors flex items-center gap-1.5">
            <span class="material-symbols-outlined text-sm">arrow_back</span>
            Back to lesson
        </a>
        <div class="px-3 py-1 bg-primary/10 border border-primary/20 rounded-full">
            <span class="font-label-sm text-xs text-primary" th:text="${state.totalXp} + ' XP'">0 XP</span>
        </div>
    </div>
</header>

<main class="pt-20 pb-16 px-6" style="max-width:1100px; margin:0 auto;">

    <!-- Boss header -->
    <div class="mb-6 flex items-start gap-4">
        <div class="w-12 h-12 rounded-xl bg-secondary/10 border border-secondary/30 flex items-center justify-center shrink-0">
            <span class="material-symbols-outlined text-secondary text-xl"
                  style="font-variation-settings:'FILL' 1;">military_tech</span>
        </div>
        <div>
            <span class="font-label-sm text-[10px] text-secondary uppercase tracking-widest">Boss Challenge</span>
            <h1 class="font-headline-lg text-2xl text-primary-text font-bold mt-0.5"
                th:text="'Challenge: ' + ${module.title}">Challenge</h1>
            <p class="font-body-md text-sm text-ghost-text mt-1">
                Complete this challenge to earn <span class="text-secondary">+100 XP</span> and unlock the next module.
            </p>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-[1fr_360px] gap-6">

        <!-- Editor form -->
        <form th:action="@{/module/{slug}/challenge(slug=${module.slug})}" method="post" class="flex flex-col gap-4">
            <div class="flex items-center gap-2">
                <span class="material-symbols-outlined text-primary text-sm"
                      style="font-variation-settings:'FILL' 0;">code</span>
                <span class="font-label-sm text-[10px] text-ghost-text uppercase tracking-widest">Your Solution | Main.java</span>
            </div>
            <textarea id="editor" name="sourceCode" data-code-editor data-code-editor-frame aria-label="Java challenge solution" spellcheck="false"
                      onkeydown="if(event.key==='Tab'){event.preventDefault();var s=this.selectionStart;this.value=this.value.substring(0,s)+'    '+this.value.substring(this.selectionEnd);this.selectionStart=this.selectionEnd=s+4;}"
                      th:text="${module.challengeTemplateCode} ?: 'public class Main {\n    public static void main(String[] args) {\n        // Write your solution here\n    }\n}'"></textarea>

            <div class="flex gap-3">
                <button type="submit"
                        class="flex-1 px-6 py-3 bg-primary text-on-primary font-bold rounded-xl flex items-center justify-center gap-2 hover:brightness-110 active:-translate-y-px transition-all font-label-sm text-sm">
                    <span class="material-symbols-outlined text-base" style="font-variation-settings:'FILL' 1;">send</span>
                    Submit Challenge
                </button>
                <a th:href="@{/learn/{slug}(slug=${module.slug})}"
                   class="px-6 py-3 border border-hairline text-ghost-text rounded-xl flex items-center gap-2 hover:text-on-surface hover:border-outline-variant transition-all font-label-sm text-sm">
                    Cancel
                </a>
            </div>
        </form>

        <!-- Instructions panel -->
        <div class="flex flex-col gap-4">
            <div class="bg-panel-slate rounded-2xl border border-hairline p-5">
                <h2 class="font-label-sm text-[10px] text-ghost-text uppercase tracking-widest mb-3">Instructions</h2>
                <div class="font-body-md text-sm text-on-surface-variant leading-relaxed whitespace-pre-wrap"
                     th:text="${module.challengeInstructions} ?: 'Demonstrate your understanding of ' + ${module.title} + ' with a working Java program.'">
                </div>
            </div>

            <!-- Previous submissions -->
            <div th:if="${!submissions.empty}" class="bg-panel-slate rounded-2xl border border-hairline overflow-hidden">
                <div class="px-5 py-3 border-b border-hairline">
                    <h2 class="font-label-sm text-[10px] text-ghost-text uppercase tracking-widest">Previous Attempts</h2>
                </div>
                <div th:each="sub, iter : ${submissions}" th:if="${iter.index < 3}"
                     class="px-5 py-3 flex items-center justify-between"
                     th:classappend="${!iter.last} ? 'border-b border-hairline' : ''">
                    <div class="flex items-center gap-2">
                        <span class="material-symbols-outlined text-sm"
                              th:classappend="${sub.passed} ? 'text-primary' : 'text-ghost-text/40'"
                              th:text="${sub.passed} ? 'check_circle' : 'radio_button_unchecked'"
                              style="font-variation-settings:'FILL' 1;">radio_button_unchecked</span>
                        <span class="font-label-sm text-xs text-ghost-text"
                              th:text="${sub.submittedAt != null ? #temporals.format(sub.submittedAt, 'MMM d, HH:mm') : 'earlier'}">date</span>
                    </div>
                    <span class="font-label-sm text-[10px] rounded-full px-2 py-0.5"
                          th:classappend="${sub.passed} ? 'bg-emerald-wash text-primary' : 'bg-fault-red/10 text-fault-red'"
                          th:text="${sub.passed} ? 'PASSED' : 'FAILED'">status</span>
                </div>
            </div>
        </div>
    </div>
</main>
<script src="/js/code-editor.js"></script>
</body>
</html>
